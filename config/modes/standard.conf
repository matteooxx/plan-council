# Mode: standard -- "a decision that is not cheap to undo"
#
# Sets:
#   - planning effort high, cross-attack high, arbitration high, assignment
#     medium;
#   - the strongest model on your ladder goes to the ARBITER, because the
#     project's own guidance is to pay for arbitration. Both planners then take
#     the next rungs, and the second planner always picks last.
#
# Promises:
#   - two planners on different models, blind to each other, then a parallel
#     cross-attack, then an arbiter that verifies claims against the code;
#   - 2N + 1 long model runs for N planners, plus one for the assignment;
#   - no model is chosen for you: every ID comes from the ladder you confirmed.
#
# Does not protect against:
#   - both planners being wrong in the same way; agreement is not proof;
#   - both planners coming from one vendor, unless Codex is seated;
#   - the arbiter being the same model as a planner;
#   - the depth setting not reaching Codex, which runs at its own effort;
#   - the rule that hides attribution not reaching a non-Claude CLI;
#   - the total bill for a council, which the plugin can neither see nor
#     predict, because each planner's answer is its own stdout;
#   - anything beyond a plan: a council does not run or test what it designs;
#   - the limits of the brief, which bound the plan;
#   - whether this change deserved a council at all. The mode does not judge
#     that; you do.
#
# The ladder is YOUR order, not a measurement, and it is as old as its date.
# A Codex planner takes a seat but no rung: it cannot be ranked on that ladder.

COUNCIL_PLANNER_EFFORT="${COUNCIL_PLANNER_EFFORT:-high}"
COUNCIL_ATTACK_EFFORT="${COUNCIL_ATTACK_EFFORT:-high}"
COUNCIL_ARBITER_EFFORT="${COUNCIL_ARBITER_EFFORT:-high}"
COUNCIL_ASSIGN_EFFORT="${COUNCIL_ASSIGN_EFFORT:-medium}"

COUNCIL_STRONGEST_FOR="${COUNCIL_STRONGEST_FOR:-arbitration}"
