# plan-council configuration. POSIX sh, sourced by the scripts.
#
# To customise, copy this file to <your-project>/.claude/plan-council.conf
# (used when the context root is <your-project>), or point the environment
# variable COUNCIL_CONFIG at any copy. The first one found wins:
#   1. $COUNCIL_CONFIG
#   2. <context-root>/.claude/plan-council.conf
#   3. this file
#
# Flag names below were written against Claude Code 2.1.x and Codex CLI.
# They are version-sensitive: run /council-doctor after every upgrade.

# --- Planners ---------------------------------------------------------------
#
# Every setting in this file defers to the environment: `VAR="${VAR:-default}"`.
# So `COUNCIL_PLANNERS="claude claude_alt" council-plan.sh ...` works for one run
# without editing anything. Keep that form when you add a setting -- a plain
# assignment here would override the environment without saying so, and a setting
# that is ignored in silence is the failure this method exists to prevent.
#
# Names of the planners that run in parallel, in order. They are labelled
# Plan A, Plan B, ... in that order; the arbiter sees only the letters.
# Each name needs a shell function planner_<name> below. At least two.
COUNCIL_PLANNERS="${COUNCIL_PLANNERS:-claude codex}"

# No Codex installed? Use two different Claude models instead:
# COUNCIL_PLANNERS="claude claude_alt"

# The contract every planner function must keep:
#   stdin   the prompt. It is byte-identical for every planner.
#   $1      absolute path of the file the planner's final answer must land in.
#           It lives in a temporary directory OUTSIDE the context root, so no
#           planner can read a rival's half-written plan.
#   cwd     the context root. The script has already cd'd there.
#   exit    0 on success. Anything else is reported as a failure.
# The planner must be read-only: it reads the code and answers; it writes
# nothing but $1 (and only through its CLI's own output option or stdout).

# Claude, read-only. Read/Glob/Grep plus read-only git; no editor, no writer.
# In a -p session anything not allowed is denied, never asked.
planner_claude() {
  claude -p --model claude-opus-5-5 \
    --permission-mode default \
    --allowedTools Read Glob Grep "Bash(git log:*)" "Bash(git show:*)" "Bash(git diff:*)" "Bash(git status:*)" "Bash(ls:*)" \
    --disallowedTools Edit Write NotebookEdit \
    > "$1"
}

# Codex CLI, read-only sandbox. Its last message lands in $1 through -o;
# the progress stream on stdout is discarded. Add -m <model> to pin a model;
# without it Codex uses the default from its own config.
planner_codex() {
  codex exec --sandbox read-only --skip-git-repo-check \
    --output-last-message "$1" - > /dev/null
}

# The no-Codex rival: a different Claude model from planner_claude.
# Disagreement is the product, so do not point both at the same model.
planner_claude_alt() {
  claude -p --model claude-sonnet-5-5 \
    --permission-mode default \
    --allowedTools Read Glob Grep "Bash(git log:*)" "Bash(git show:*)" "Bash(git diff:*)" "Bash(git status:*)" "Bash(ls:*)" \
    --disallowedTools Edit Write NotebookEdit \
    > "$1"
}

# Adding a third planner is one function plus its name in COUNCIL_PLANNERS.
# Example for a CLI that reads the prompt on stdin and prints the answer on
# stdout (UNVERIFIED: check your tool's --help for its non-interactive and
# read-only flags before relying on this):
#
# planner_gemini() {
#   gemini --model <model-id> > "$1"
# }
#
# Example for a CLI that writes its answer to a file you name:
#
# planner_mytool() {
#   mytool run --read-only --answer-file "$1" --prompt-file /dev/stdin
# }
#
# Never pass the prompt as a command-line argument: briefs with embedded
# plans exceed the argument-length limit on some platforms (about 32 KB on
# Windows), and the failure looks like an empty answer.

# --- Arbiter ----------------------------------------------------------------
#
# Decides between the plans. Read-only by construction: it has no edit or
# write tool, and its answer goes to stdout, which the script redirects to $1.
# It is also the model that drafts the assignment table (/council-assign).
# Prefer a model that is not one of the planners; it never learns which
# planner wrote which plan either way.
arbiter() {
  claude -p --model claude-opus-5-5 \
    --permission-mode default \
    --allowedTools Read Glob Grep "Bash(git log:*)" "Bash(git show:*)" "Bash(git diff:*)" "Bash(git status:*)" "Bash(ls:*)" "Bash(wc:*)" \
    --disallowedTools Edit Write NotebookEdit \
    > "$1"
}

# --- Assignment ---------------------------------------------------------------
#
# The risk floor: the weakest executor allowed for any task whose unnoticed
# failure would touch data integrity, lose data silently, or reach production.
# It must be the name of an agent in the roster.
COUNCIL_RISK_FLOOR="${COUNCIL_RISK_FLOOR:-implementer}"

# Extra directories of agent definitions to add to the roster, space-separated
# absolute paths (for example your own ~/.claude/agents). The plugin's own
# agents are always included.
COUNCIL_AGENT_DIRS="${COUNCIL_AGENT_DIRS:-}"

# Plain-sounding answers under this many bytes are treated as failures.
COUNCIL_MIN_BYTES="${COUNCIL_MIN_BYTES:-400}"
