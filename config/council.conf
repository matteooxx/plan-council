# plan-council configuration. POSIX sh, sourced by the scripts.
#
# THIS FILE IS A DEFAULT, NOT A CHOICE. It cannot know which models your
# account has, whether Codex is connected, or how deep you want each phase to
# think. Run /council-setup once: it asks, checks what it can, and writes your
# answers to <your-project>/.claude/plan-council.conf. The first file found
# wins:
#   1. $COUNCIL_CONFIG
#   2. <context-root>/.claude/plan-council.conf
#   3. this file
#
# Flag names below were verified against Claude Code 2.1.325 and codex-cli
# 0.162.1 on 2026-11-14. They are version-sensitive: run /council-doctor after
# every upgrade.
#
# EVERY SETTING MUST DEFER TO THE ENVIRONMENT: VAR="${VAR:-default}".
# A plain assignment overrides an exported value, and the scripts now refuse
# to run when that happens rather than report the opposite of what occurred.
# One exception, with a reason: a setting whose EMPTY value means something
# uses VAR="${VAR-default}", without the colon, so that an exported empty
# value survives. Otherwise "no cap" or "no extra agent directories" could not
# be asked for at all. That applies to COUNCIL_BUDGET_USD,
# COUNCIL_MODEL_CODEX and COUNCIL_AGENT_DIRS.

# --- Mode --------------------------------------------------------------------
#
# A mode answers the technical questions from one choice about the situation
# you are in. `/council-setup` asks that question and writes the answer here;
# `COUNCIL_MODE=thorough council-plan.sh ...` switches for a single run.
# Empty means no mode, which is why this line has no colon: an exported empty
# value has to survive.
#
# A mode file (config/modes/<name>.conf) may set the four per-phase efforts and
# COUNCIL_STRONGEST_FOR, and nothing else. Never a model ID, never the planner
# list, never a dollar figure.
COUNCIL_MODE="${COUNCIL_MODE-}"

# The planner list is set BEFORE the mode is applied, because the deal below
# has to know which seats are in play. Its comment block is further down, with
# the planner functions.
COUNCIL_PLANNERS="${COUNCIL_PLANNERS:-claude codex}"

# Which seat gets the strongest model, and what the user's ladder says
# "strongest" means. Both are empty unless a mode or the user sets them.
COUNCIL_STRONGEST_FOR="${COUNCIL_STRONGEST_FOR:-}"
COUNCIL_MODEL_LADDER="${COUNCIL_MODEL_LADDER:-}"
COUNCIL_MODEL_LADDER_DATE="${COUNCIL_MODEL_LADDER_DATE:-}"

# Sources the mode file, then deals the ladder to the seats. Everything the
# environment or a project config set earlier still wins: the mode's lines and
# the deal both defer. With no mode set, this does nothing at all.
council_apply_mode

# --- Models ------------------------------------------------------------------
#
# Pinned exact IDs, not aliases: an alias moves under you, and the whole point
# of this method is knowing which model answered. --model also accepts the
# aliases 'fable', 'opus' and 'sonnet' if you prefer the latest of a line.
#
# Claude Fable 5.2 (claude-fable-5-2) is the most capable model; it costs more
# per token than Opus. If your account has it, /council-setup will offer it.
# These defaults name Opus because it is the broadest entitlement, NOT because
# it is the best available to you.
#
# Skipped when a mode has dealt the seats: the deal fills them from your
# ladder, and a default written here would hide a seat the deal never reached.
#
# So under a mode a seat the deal did not reach (with planners 'claude codex',
# COUNCIL_MODEL_CLAUDE_ALT) stays UNSET until the plugin's own fallbacks run,
# and those run only after your config has returned. A line in your config
# below the line that sources this file, reading such a seat, must therefore
# write ${COUNCIL_MODEL_CLAUDE_ALT-} and not a bare $COUNCIL_MODEL_CLAUDE_ALT.
# The bare form stops the load as an unset variable -- measured 2026-11-15,
# rc=127 under sh and rc=2 under dash, where the code before this block loaded
# with rc=0. It fails loudly, not silently, and only under a mode, so a config
# without a mode is unaffected. There is no mode documentation yet in
# README.md, commands/, skills/ or prompts/: when that step comes, this belongs
# in the user-facing docs.
if [ "${_council_seats_dealt-}" != 1 ]; then
  COUNCIL_MODEL_CLAUDE="${COUNCIL_MODEL_CLAUDE:-claude-opus-5-5}"
  COUNCIL_MODEL_CLAUDE_ALT="${COUNCIL_MODEL_CLAUDE_ALT:-claude-sonnet-5-5}"
  COUNCIL_MODEL_ARBITER="${COUNCIL_MODEL_ARBITER:-claude-opus-5-5}"
fi

# Codex runs on its own configured default unless you pin one here.
COUNCIL_MODEL_CODEX="${COUNCIL_MODEL_CODEX-}"

# --- Effort, per phase -------------------------------------------------------
#
# --effort takes low, medium, high, xhigh or max. It is the main cost lever
# inside one model: it sets how long the model reasons before answering, so
# the bill and the wall-clock move with it. Rough guidance:
#
#   low     cheapest and quickest; fine for mechanical phases, thin on design
#   medium  the step down that usually holds quality on routine work
#   high    the sweet spot for planning and for judging a plan
#   xhigh   more thorough on hard design problems; costs noticeably more
#   max     for when correctness matters more than cost; the ceiling
#
# One planner function serves both planning and attacking, so the depth is
# chosen per phase here, not inside the function.
COUNCIL_PLANNER_EFFORT="${COUNCIL_PLANNER_EFFORT:-high}"
COUNCIL_ATTACK_EFFORT="${COUNCIL_ATTACK_EFFORT:-high}"
COUNCIL_ARBITER_EFFORT="${COUNCIL_ARBITER_EFFORT:-high}"
COUNCIL_ASSIGN_EFFORT="${COUNCIL_ASSIGN_EFFORT:-medium}"

# A hard dollar cap per child run, enforced by the CLI (--max-budget-usd,
# which works only with --print; every planner here uses it). Empty means no
# cap, which is the default here: nothing is capped unless you ask. With N
# planners a council is 2N + 1 runs plus one for the assignment, so a cap of 2
# on four runs caps that side of the council at 8. The cap has a price of its
# own: a run that reaches it stops instead of finishing.
#
# TO REMOVE A CAP that a config sets, for a single run:
#     COUNCIL_BUDGET_USD= council-plan.sh brief.md --root .
# That works only because this line is written with `-` and not `:-`. With
# `:-` an exported EMPTY value counts as unset and the default comes back, so
# there would be no way to say "no cap" for one run -- and, since the scripts
# now refuse to start when a config overrides an exported value, the run would
# die with advice that does not apply. Measured 2026-11-14.
#
# So: a setting whose EMPTY value means something uses "${VAR-default}";
# every other setting uses "${VAR:-default}". Here that is this one,
# COUNCIL_MODEL_CODEX and COUNCIL_AGENT_DIRS.
COUNCIL_BUDGET_USD="${COUNCIL_BUDGET_USD-}"

# --- Planners ----------------------------------------------------------------
#
# Names of the planners that run in parallel, in order. They are labelled
# Plan A, Plan B, ... in that order; the arbiter sees only the letters.
# Each name needs a shell function planner_<name> below. At least two.
#
# The line itself is near the top of this file, above the mode, because the
# deal has to know which seats are in play before it runs.
#
# No Codex installed or connected? Use two different Claude models instead:
# COUNCIL_PLANNERS="claude claude_alt"

# The contract every planner function must keep:
#   stdin   the prompt. It is byte-identical for every planner.
#   $1      absolute path of the file the planner's final answer must land in.
#           It lives in a temporary directory OUTSIDE the context root, so no
#           planner can read a rival's half-written plan.
#   cwd     the context root. The script has already cd'd there.
#   exit    0 on success. Anything else is reported as a failure.
# The planner must be read-only: it reads the code and answers; it writes
# nothing but $1 (and only through its CLI's own output option or stdout).
#
# "$COUNCIL_DENY" is set by the scripts to a rule that keeps the child out of
# the run directory, where the letter-to-planner mapping lives. Keep it in
# every function: without it a planner or the arbiter can read council.txt and
# learn who wrote which plan, which was measured, not supposed. /council-doctor
# REFUSES TO START if a function that drives claude drops it: planning and both
# review phases stop, naming the function, before anything is paid for. Only
# /council-assign continues, with a warning, because no attribution is at stake
# there. A function driving another CLI gets no rule and no complaint, just a
# note from /council-doctor: the rule is a Claude Code permission rule and
# cannot reach it.

# Claude, read-only. Read/Glob/Grep plus read-only git; no editor, no writer.
# In a -p session anything not allowed is denied, never asked.
planner_claude() {
  claude -p --model "$COUNCIL_MODEL_CLAUDE" \
    --effort "$(council_effort)" \
    --permission-mode default \
    $(council_budget_flags) \
    --allowedTools Read Glob Grep "Bash(git log:*)" "Bash(git show:*)" "Bash(git diff:*)" "Bash(git status:*)" "Bash(ls:*)" \
    --disallowedTools Edit Write NotebookEdit "$COUNCIL_DENY" "$COUNCIL_DENY2" \
    > "$1"
}

# The no-Codex rival: a different Claude model from planner_claude.
# Disagreement is the product, so do not point both at the same model.
planner_claude_alt() {
  claude -p --model "$COUNCIL_MODEL_CLAUDE_ALT" \
    --effort "$(council_effort)" \
    --permission-mode default \
    $(council_budget_flags) \
    --allowedTools Read Glob Grep "Bash(git log:*)" "Bash(git show:*)" "Bash(git diff:*)" "Bash(git status:*)" "Bash(ls:*)" \
    --disallowedTools Edit Write NotebookEdit "$COUNCIL_DENY" "$COUNCIL_DENY2" \
    > "$1"
}

# Claude Fable, for accounts that have it. Add 'fable' to COUNCIL_PLANNERS.
planner_fable() {
  claude -p --model claude-fable-5-2 \
    --effort "$(council_effort)" \
    --permission-mode default \
    $(council_budget_flags) \
    --allowedTools Read Glob Grep "Bash(git log:*)" "Bash(git show:*)" "Bash(git diff:*)" "Bash(git status:*)" "Bash(ls:*)" \
    --disallowedTools Edit Write NotebookEdit "$COUNCIL_DENY" "$COUNCIL_DENY2" \
    > "$1"
}

# Codex CLI, read-only sandbox. Its last message lands in $1 through -o; the
# progress stream on stdout is discarded. Codex has no effort flag and no
# budget flag of this kind, so those settings do not reach it: its depth comes
# from its own model choice and config.
planner_codex() {
  if [ -n "$COUNCIL_MODEL_CODEX" ]; then
    codex exec --sandbox read-only --skip-git-repo-check \
      -m "$COUNCIL_MODEL_CODEX" \
      --output-last-message "$1" - > /dev/null
  else
    codex exec --sandbox read-only --skip-git-repo-check \
      --output-last-message "$1" - > /dev/null
  fi
}

# Adding another planner is one function plus its name in COUNCIL_PLANNERS.
# Example for a CLI that reads the prompt on stdin and prints the answer on
# stdout (UNVERIFIED: check your tool's --help for its non-interactive and
# read-only flags before relying on this):
#
# planner_gemini() {
#   gemini --model <model-id> > "$1"
# }
#
# Never pass the prompt as a command-line argument: briefs with embedded plans
# exceed the argument-length limit on some platforms (about 32 KB on Windows),
# and the failure looks like an empty answer. A variadic flag such as
# --disallowedTools will also swallow a prompt written after it.

# --- Arbiter -----------------------------------------------------------------
#
# Decides between the plans. Read-only by construction: it has no edit or
# write tool, and its answer goes to stdout, which the script redirects to $1.
# It is also the model that drafts the assignment table (/council-assign).
# Prefer a model that is not one of the planners. It is denied the run
# directory, so it cannot look up which planner wrote which plan.
arbiter() {
  claude -p --model "$COUNCIL_MODEL_ARBITER" \
    --effort "$(council_effort)" \
    --permission-mode default \
    $(council_budget_flags) \
    --allowedTools Read Glob Grep "Bash(git log:*)" "Bash(git show:*)" "Bash(git diff:*)" "Bash(git status:*)" "Bash(ls:*)" "Bash(wc:*)" \
    --disallowedTools Edit Write NotebookEdit "$COUNCIL_DENY" "$COUNCIL_DENY2" \
    > "$1"
}

# --- Assignment --------------------------------------------------------------
#
# The risk floor: the weakest executor allowed for any task whose unnoticed
# failure would touch data integrity, lose data silently, or reach production.
# It must be the name of an agent in the roster.
COUNCIL_RISK_FLOOR="${COUNCIL_RISK_FLOOR:-implementer}"

# Extra directories of agent definitions to add to the roster, space-separated
# absolute paths (for example your own ~/.claude/agents). The plugin's own
# agents are always included. Paths cannot contain spaces.
COUNCIL_AGENT_DIRS="${COUNCIL_AGENT_DIRS-}"

# Plain-sounding answers under this many bytes are treated as failures.
COUNCIL_MIN_BYTES="${COUNCIL_MIN_BYTES:-400}"
